project_id = "fleetfuel-shared"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "fleetfuel://shared"
additional_redirect_urls = [
  "fleetfuel://shared/auth/sign-in",
  "fleetfuel://shared/auth/sign-up",
  "fleetfuel://shared/accept-invite"
]
jwt_expiry = 3600
